<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jevx HookとCompaction補助の時系列</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #7a8399;
      --accent: #eb6c36; --link: #2e5aa8; --sans: 'Geist', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      --serif: 'Instrument Serif', serif; --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; margin: 0; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 960px; margin: 0 auto; }
    .eyebrow { margin: 0 0 .5rem; color: var(--muted); font: 500 .66rem var(--mono); letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0 0 .5rem; font: 400 clamp(1.7rem, 2.5vw + .8rem, 2.35rem)/1.1 var(--serif); letter-spacing: -.02em; }
    .dek { max-width: 46rem; margin: 0 0 1.5rem; color: var(--muted); font-size: .95rem; line-height: 1.7; }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">JEVX · HOOK / COMPACTION</p>
    <h1>Hookは「観測」と「checkpoint補助」を順番に行う</h1>
    <p class="dek">Hookの導入はopt-inです。発火したイベントは安全なmetadataとして保存され、compact後のSessionStartで補助contextだけが返ります。</p>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="jevx-hooks-title jevx-hooks-desc">
      <title id="jevx-hooks-title">jevx HookとCompaction補助の時系列</title>
      <desc id="jevx-hooks-desc">Codex CLIがjevx Hookへイベントを渡し、Hookがローカルstateへhashとredacted metadataを保存し、compact後に補助contextを返す流れ。</desc>
      <defs>
        <style>
          .actor-title { fill: #2d3142; font: 600 13px 'Geist', 'Hiragino Sans', 'Yu Gothic', sans-serif; text-anchor: middle; }
          .actor-sub { fill: #4f5d75; font: 400 9px 'Geist Mono', ui-monospace, monospace; text-anchor: middle; }
          .tag { fill: #7a8399; font: 500 8px 'Geist Mono', ui-monospace, monospace; letter-spacing: .12em; }
          .message { fill: #4f5d75; font: 400 8px 'Geist Mono', ui-monospace, monospace; letter-spacing: .05em; text-anchor: middle; }
          .legend { fill: #4f5d75; font: 400 10px 'Geist', 'Hiragino Sans', 'Yu Gothic', sans-serif; }
          .legend-key { fill: #4f5d75; font: 500 8px 'Geist Mono', ui-monospace, monospace; letter-spacing: .16em; }
        </style>
        <marker id="jevx-hooks-call" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#2e5aa8"/></marker>
        <marker id="jevx-hooks-async" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#4f5d75"/></marker>
        <marker id="jevx-hooks-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
        <marker id="jevx-hooks-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#eb6c36"/></marker>
      </defs>

      <rect width="960" height="600" fill="#f5f5f5"/>

      <!-- Opt-in note is separate from the time-ordered messages. -->
      <rect x="398" y="20" width="164" height="24" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="480" y="36" fill="#eb6c36" class="tag" text-anchor="middle">OPT-IN · DRY-RUN → TRUST</text>

      <!-- Lifelines first. -->
      <line x1="160" y1="128" x2="160" y2="500" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="480" y1="128" x2="480" y2="500" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="800" y1="128" x2="800" y2="500" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Activation bars. -->
      <rect x="476" y="152" width="8" height="340" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="796" y="202" width="8" height="196" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- Messages: calls are solid, writes/returns are dashed, success is accent. -->
      <line x1="160" y1="164" x2="480" y2="164" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#jevx-hooks-call)"/>
      <line x1="480" y1="208" x2="800" y2="208" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#jevx-hooks-open)"/>
      <line x1="160" y1="252" x2="480" y2="252" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#jevx-hooks-call)"/>
      <line x1="480" y1="296" x2="800" y2="296" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#jevx-hooks-open)"/>
      <line x1="160" y1="340" x2="480" y2="340" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#jevx-hooks-call)"/>
      <line x1="480" y1="384" x2="800" y2="384" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#jevx-hooks-open)"/>
      <line x1="160" y1="428" x2="480" y2="428" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#jevx-hooks-call)"/>
      <line x1="480" y1="472" x2="160" y2="472" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#jevx-hooks-accent)"/>

      <!-- Message masks maintain a visible gap above each connector. -->
      <rect x="294" y="144" width="52" height="12" rx="2" fill="#f5f5f5"/><text x="320" y="153" class="message">PROMPT</text>
      <rect x="614" y="188" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="650" y="197" class="message">RECORD</text>
      <rect x="288" y="232" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="320" y="241" class="message">PRECOMPACT</text>
      <rect x="612" y="276" width="76" height="12" rx="2" fill="#f5f5f5"/><text x="650" y="285" class="message">CHECKPOINT</text>
      <rect x="288" y="320" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="320" y="329" class="message">POSTCOMPACT</text>
      <rect x="612" y="364" width="76" height="12" rx="2" fill="#f5f5f5"/><text x="650" y="373" class="message">CHECKPOINT</text>
      <rect x="292" y="408" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="320" y="417" class="message">SESSIONSTART</text>
      <rect x="284" y="452" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="320" y="461" fill="#eb6c36" class="message">REDACTED CTX</text>

      <!-- Actor boxes are drawn after arrows/labels. -->
      <rect x="88" y="72" width="144" height="56" rx="6" fill="#f5f5f5" stroke="#7a8399" stroke-width="1"/>
      <rect x="96" y="80" width="36" height="12" rx="2" fill="none" stroke="rgba(122,131,153,0.50)" stroke-width="0.8"/><text x="114" y="89" class="tag">ACTOR</text>
      <text x="160" y="104" class="actor-title">Codex CLI</text><text x="160" y="119" class="actor-sub">event source</text>

      <rect x="408" y="72" width="144" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="416" y="80" width="36" height="12" rx="2" fill="rgba(235,108,54,0.14)" stroke="rgba(235,108,54,0.55)" stroke-width="0.8"/><text x="434" y="89" fill="#eb6c36" class="tag">HOOK</text>
      <text x="480" y="104" class="actor-title">jevx Hook</text><text x="480" y="119" class="actor-sub">observe + assist</text>

      <rect x="728" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="736" y="80" width="38" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/><text x="755" y="89" class="tag">STATE</text>
      <text x="800" y="104" class="actor-title">Local state</text><text x="800" y="119" class="actor-sub">hash + metadata</text>

      <!-- Legend -->
      <line x1="56" y1="528" x2="904" y2="528" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="56" y="546" class="legend-key">LEGEND</text>
      <line x1="56" y1="564" x2="88" y2="564" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#jevx-hooks-call)"/>
      <text x="100" y="568" class="legend">Codex event</text>
      <line x1="256" y1="564" x2="288" y2="564" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#jevx-hooks-open)"/>
      <text x="300" y="568" class="legend">write / async</text>
      <line x1="456" y1="564" x2="488" y2="564" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#jevx-hooks-accent)"/>
      <text x="500" y="568" class="legend">redacted additionalContext</text>
    </svg>
  </main>
</body>
</html>
