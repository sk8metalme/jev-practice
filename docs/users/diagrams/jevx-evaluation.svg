<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="jevx-eval-independent-title jevx-eval-independent-desc">
  <title id="jevx-eval-independent-title">jevx評価コマンドの独立した測定経路</title>
  <desc id="jevx-eval-independent-desc">用途別のfixtureやJSONLをeval、compact-eval、conversation-eval、correlateへ独立して渡し、それぞれのレポートを利用者が比較して導入判断を行う流れ。コマンドを直列に実行して全項目を測定するものではない。</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      .zone-label { fill: #4f5d75; font: 500 8px 'Geist Mono', ui-monospace, monospace; letter-spacing: .14em; }
      .node-title { fill: #2d3142; font: 600 10px 'Geist', 'Hiragino Sans', 'Yu Gothic', sans-serif; text-anchor: middle; }
      .node-sub { fill: #4f5d75; font: 400 7.5px 'Geist', 'Hiragino Sans', 'Yu Gothic', sans-serif; text-anchor: middle; }
      .node-tech { fill: #7a8399; font: 400 7px 'Geist Mono', ui-monospace, monospace; text-anchor: middle; }
      .tag { fill: #7a8399; font: 500 7px 'Geist Mono', ui-monospace, monospace; letter-spacing: .12em; }
      .legend { fill: #4f5d75; font: 400 9px 'Geist', 'Hiragino Sans', 'Yu Gothic', sans-serif; }
      .legend-key { fill: #4f5d75; font: 500 8px 'Geist Mono', ui-monospace, monospace; letter-spacing: .14em; }
  </style>
    <marker id="jevx-eval-independent-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#4f5d75"/></marker>
    <marker id="jevx-eval-independent-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#eb6c36"/></marker>
  </defs>

  <rect width="800" height="500" fill="#f5f5f5"/>

  <!-- Three zones: inputs, independent runners, and the human decision. -->
  <rect x="32" y="48" width="216" height="304" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.18" stroke-width="1"/>
  <rect x="272" y="48" width="240" height="360" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.18" stroke-width="1"/>
  <rect x="536" y="164" width="232" height="168" rx="8" fill="#eb6c36" fill-opacity="0.03" stroke="#eb6c36" stroke-opacity="0.34" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="48" y="52" width="108" height="14" rx="2" fill="#f5f5f5"/>
  <text x="56" y="62" class="zone-label">INPUTS</text>
  <rect x="288" y="52" width="144" height="14" rx="2" fill="#f5f5f5"/>
  <text x="296" y="62" class="zone-label">INDEPENDENT RUNNERS</text>
  <rect x="552" y="168" width="142" height="14" rx="2" fill="#f5f5f5"/>
  <text x="560" y="178" class="zone-label">HUMAN DECISION</text>

  <!-- Connectors are drawn before all node boxes. Each runner has its own path. -->
  <path d="M232 200 H248 Q256 200 256 192 V116 H296" fill="none" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#jevx-eval-independent-muted)"/>
  <path d="M232 224 H260 Q268 224 268 216 V196 H296" fill="none" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#jevx-eval-independent-muted)"/>
  <path d="M232 248 H272 Q280 248 280 256 V276 H296" fill="none" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#jevx-eval-independent-muted)"/>
  <path d="M232 272 H284 Q292 272 292 280 V356 H296" fill="none" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#jevx-eval-independent-muted)"/>
  <path d="M480 116 H504 Q512 116 512 124 V220 H560" fill="none" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#jevx-eval-independent-muted)"/>
  <path d="M480 196 H516 Q524 196 524 204 V240 H560" fill="none" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#jevx-eval-independent-muted)"/>
  <path d="M480 276 H528 Q536 276 536 268 V260 H560" fill="none" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#jevx-eval-independent-muted)"/>
  <path d="M480 356 H548 Q556 356 556 348 V280 H560" fill="none" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#jevx-eval-independent-muted)"/>

  <!-- Shared input catalog. The four rows align with the four independent runners. -->
  <rect x="48" y="176" width="184" height="144" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-opacity="0.28" stroke-width="1"/>
  <rect x="56" y="184" width="30" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.38" stroke-width="0.8"/>
  <text x="71" y="193" class="tag">INPUT</text>
  <text x="140" y="208" class="node-title">用途別の入力</text>
  <text x="140" y="226" class="node-sub">Skill fixture</text>
  <text x="140" y="242" class="node-sub">synthetic transcript</text>
  <text x="140" y="258" class="node-sub">anonymous JSONL / Hook records</text>
  <text x="140" y="294" class="node-tech">prepared / redacted</text>

  <!-- Independent command runners. -->
  <rect x="296" y="88" width="184" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.28" stroke-width="1"/>
  <rect x="304" y="96" width="30" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.38" stroke-width="0.8"/>
  <text x="319" y="105" class="tag">RUN</text>
  <text x="388" y="112" class="node-title">eval / eval-repeat</text>
  <text x="388" y="126" class="node-sub">Skill選択品質・ばらつき</text>

  <rect x="296" y="168" width="184" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.28" stroke-width="1"/>
  <rect x="304" y="176" width="30" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.38" stroke-width="0.8"/>
  <text x="319" y="185" class="tag">RUN</text>
  <text x="388" y="192" class="node-title">compact-eval</text>
  <text x="388" y="206" class="node-sub">合成fixtureの安全性</text>

  <rect x="296" y="248" width="184" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.28" stroke-width="1"/>
  <rect x="304" y="256" width="30" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.38" stroke-width="0.8"/>
  <text x="319" y="265" class="tag">RUN</text>
  <text x="388" y="272" class="node-title">conversation-eval</text>
  <text x="388" y="286" class="node-sub">匿名化会話JSONL</text>

  <rect x="296" y="328" width="184" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.28" stroke-width="1"/>
  <rect x="304" y="336" width="30" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.38" stroke-width="0.8"/>
  <text x="319" y="345" class="tag">RUN</text>
  <text x="388" y="352" class="node-title">correlate</text>
  <text x="388" y="366" class="node-sub">Hook重複・イベント分布</text>

  <!-- One human decision consumes separate reports; it is not another runner. -->
  <rect x="560" y="204" width="184" height="96" rx="6" fill="#eb6c36" fill-opacity="0.07" stroke="#eb6c36" stroke-width="1.2"/>
  <rect x="568" y="212" width="30" height="12" rx="2" fill="#eb6c36" fill-opacity="0.20" stroke="#eb6c36" stroke-opacity="0.42" stroke-width="0.8"/>
  <text x="583" y="221" fill="#eb6c36" class="tag">YOU</text>
  <text x="652" y="236" class="node-title">導入判断</text>
  <text x="652" y="251" class="node-sub">各レポートを個別に比較</text>
  <text x="652" y="267" class="node-tech">quality / safety / cost</text>

  <!-- Legend -->
  <line x1="48" y1="424" x2="752" y2="424" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
  <text x="48" y="442" class="legend-key">LEGEND</text>
  <line x1="48" y1="464" x2="80" y2="464" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#jevx-eval-independent-muted)"/>
  <text x="92" y="468" class="legend">用途別runnerへの独立した測定</text>
  <line x1="376" y1="464" x2="408" y2="464" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#jevx-eval-independent-accent)"/>
  <text x="420" y="468" class="legend">個別レポートを人が比較</text>
  <text x="752" y="468" class="legend" text-anchor="end">各コマンドは直列処理ではない</text>
</svg>
