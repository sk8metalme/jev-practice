<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 728 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="jevx-eval-title jevx-eval-desc">
      <title id="jevx-eval-title">jevx評価Runnerの入力から導入判断まで</title>
      <desc id="jevx-eval-desc">安全なfixtureまたはJSONLをローカル評価と任意のJev評価へ渡し、品質・安全性の集計レポートを利用者が導入判断に使う流れ。</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
          .step-number, .step-label, .lane-label, .role-text, .chip-text, .legend-label, .arrow-label { font-family: 'Geist Mono', ui-monospace, monospace; text-anchor: middle; }
          .step-number { fill: #2d3142; font-size: 7px; font-weight: 600; }
          .step-label { fill: #4f5d75; font-size: 7px; font-weight: 500; letter-spacing: .12em; }
          .lane-label { fill: #4f5d75; font-size: 8px; font-weight: 500; letter-spacing: .14em; }
          .role-text { fill: #2d3142; font-size: 6px; font-weight: 600; }
          .node-title { fill: #2d3142; font: 600 9px 'Geist', 'Hiragino Sans', 'Yu Gothic', sans-serif; text-anchor: middle; }
          .node-sub { fill: #4f5d75; font: 400 6.5px 'Geist', 'Hiragino Sans', 'Yu Gothic', sans-serif; text-anchor: middle; }
          .node-tool { fill: #7a8399; font: 400 6.5px 'Geist Mono', ui-monospace, monospace; text-anchor: middle; }
          .chip-text { fill: #fff; font-size: 5px; font-weight: 700; }
          .focal-text { fill: #eb6c36; }
          .legend-label { fill: #4f5d75; font-size: 7px; font-weight: 500; letter-spacing: .12em; text-anchor: end; }
          .legend-text { fill: #4f5d75; font: 400 7px 'Geist', 'Hiragino Sans', 'Yu Gothic', sans-serif; }
          .arrow-label { fill: #eb6c36; font-size: 7px; letter-spacing: .05em; }
        </style>
        <marker id="jevx-eval-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#4f5d75"/></marker>
        <marker id="jevx-eval-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#eb6c36"/></marker>
      </defs>

      <rect width="728" height="356" fill="#f5f5f5"/>
      <rect x="0" y="36" width="728" height="80" fill="#2d3142" fill-opacity="0.018"/>
      <rect x="0" y="196" width="728" height="80" fill="#2d3142" fill-opacity="0.018"/>

      <!-- Header and lane structure. -->
      <line x1="0" y1="36" x2="728" y2="36" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
      <line x1="0" y1="116" x2="728" y2="116" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
      <line x1="0" y1="196" x2="728" y2="196" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
      <line x1="0" y1="276" x2="728" y2="276" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
      <line x1="140" y1="36" x2="140" y2="276" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>

      <g aria-label="Evaluation steps">
        <rect x="180" y="6" width="32" height="16" rx="8" fill="#2d3142" fill-opacity="0.12"/><text x="196" y="14" class="step-number">01</text><text x="196" y="29" class="step-label">PREPARE</text>
        <rect x="292" y="6" width="32" height="16" rx="8" fill="#2d3142" fill-opacity="0.12"/><text x="308" y="14" class="step-number">02</text><text x="308" y="29" class="step-label">LOCAL</text>
        <rect x="404" y="6" width="32" height="16" rx="8" fill="#2d3142" fill-opacity="0.12"/><text x="420" y="14" class="step-number">03</text><text x="420" y="29" class="step-label">JEV</text>
        <rect x="516" y="6" width="32" height="16" rx="8" fill="#2d3142" fill-opacity="0.12"/><text x="532" y="14" class="step-number">04</text><text x="532" y="29" class="step-label">CHECK</text>
        <rect x="628" y="6" width="32" height="16" rx="8" fill="#eb6c36" fill-opacity="0.20"/><text x="644" y="14" class="step-number focal-text">05</text><text x="644" y="29" class="step-label focal-text">DECIDE</text>
      </g>

      <g aria-label="Evaluation roles">
        <text x="70" y="72" class="lane-label">INPUT</text><text x="70" y="84" class="lane-label">OWNER</text>
        <text x="70" y="152" class="lane-label">EVAL</text><text x="70" y="164" class="lane-label">RUNNER</text>
        <text x="70" y="232" class="lane-label">READER</text><text x="70" y="244" class="lane-label">DECISION</text>
      </g>

      <!-- Connectors first. The JEV branch is optional; the focal handoff is the safe report. -->
      <path d="M246 76 H300 Q308 76 308 84 V124" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#jevx-eval-muted)"/>
      <line x1="358" y1="156" x2="370" y2="156" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#jevx-eval-muted)"/>
      <line x1="470" y1="156" x2="482" y2="156" stroke="#4f5d75" stroke-width="1" marker-end="url(#jevx-eval-muted)"/>
      <path d="M582 156 H636 Q644 156 644 164 V204" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#jevx-eval-accent)"/>
      <rect x="584" y="132" width="94" height="12" rx="2" fill="#f5f5f5"/>
      <text x="631" y="141" class="arrow-label">SAFE METRICS</text>

      <!-- Input node -->
      <rect x="146" y="44" width="100" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-opacity="0.25"/>
      <rect x="150" y="48" width="18" height="10" rx="3" fill="#2d3142" fill-opacity="0.12"/><text x="159" y="53" class="role-text">IN</text>
      <text x="196" y="67" class="node-title">安全なfixture</text><text x="196" y="79" class="node-sub">JSONL / 合成データ</text><text x="196" y="91" class="node-tool">user prepared</text>
      <rect x="226" y="98" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="234" y="104" class="chip-text">DB</text>

      <!-- Local baseline -->
      <rect x="258" y="124" width="100" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-opacity="0.25"/>
      <rect x="262" y="128" width="18" height="10" rx="3" fill="#2d3142" fill-opacity="0.12"/><text x="271" y="133" class="role-text">RUN</text>
      <text x="308" y="147" class="node-title">ローカル基準</text><text x="308" y="159" class="node-sub">dry-run / 外部なし</text><text x="308" y="171" class="node-tool">baseline</text>
      <rect x="262" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="270" y="184" class="chip-text">DB</text>
      <rect x="338" y="178" width="16" height="8" rx="3" fill="#b8915a"/><text x="346" y="184" class="chip-text">TB</text>

      <!-- Optional Jev -->
      <rect x="370" y="124" width="100" height="64" rx="6" fill="#2e5aa8" fill-opacity="0.04" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="374" y="128" width="18" height="10" rx="3" fill="#2e5aa8" fill-opacity="0.14"/><text x="383" y="133" fill="#2e5aa8" class="role-text">JEV</text>
      <text x="420" y="147" class="node-title">Jev任意</text><text x="420" y="159" class="node-sub">API key + no dry-run</text><text x="420" y="171" class="node-tool">Gateway call</text>
      <rect x="374" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="382" y="184" class="chip-text">DB</text>
      <rect x="450" y="178" width="16" height="8" rx="3" fill="#b8915a"/><text x="458" y="184" class="chip-text">TB</text>

      <!-- Safety check -->
      <rect x="482" y="124" width="100" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-opacity="0.25"/>
      <rect x="486" y="128" width="18" height="10" rx="3" fill="#2d3142" fill-opacity="0.12"/><text x="495" y="133" class="role-text">QA</text>
      <text x="532" y="147" class="node-title">安全性チェック</text><text x="532" y="159" class="node-sub">保持・漏えい・重複</text><text x="532" y="171" class="node-tool">report only</text>
      <rect x="486" y="178" width="16" height="8" rx="3" fill="#b8915a"/><text x="494" y="184" class="chip-text">TB</text>
      <rect x="562" y="178" width="16" height="8" rx="3" fill="#b8915a"/><text x="570" y="184" class="chip-text">TB</text>

      <!-- Decision node receives focal handoff. -->
      <rect x="594" y="204" width="100" height="64" rx="6" fill="#eb6c36" fill-opacity="0.07" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="598" y="208" width="18" height="10" rx="3" fill="#eb6c36" fill-opacity="0.20"/><text x="607" y="213" fill="#eb6c36" class="role-text">YOU</text>
      <text x="644" y="227" class="node-title">導入判断</text><text x="644" y="239" class="node-sub">品質・コスト・境界</text><text x="644" y="251" class="node-tool">human decision</text>
      <rect x="598" y="258" width="16" height="8" rx="3" fill="#b8915a"/><text x="606" y="264" class="chip-text">TB</text>
      <rect x="674" y="258" width="16" height="8" rx="3" fill="#9c6b50"/><text x="682" y="264" class="chip-text">FL</text>

      <!-- Legend -->
      <text x="164" y="293" class="legend-label">STEPS</text>
      <rect x="180" y="284" width="24" height="12" rx="6" fill="#2d3142" fill-opacity="0.12"/><text x="192" y="292" class="step-number">01</text><text x="212" y="293" class="legend-text">Prepare</text>
      <rect x="274" y="284" width="24" height="12" rx="6" fill="#2d3142" fill-opacity="0.12"/><text x="286" y="292" class="step-number">02</text><text x="306" y="293" class="legend-text">Local</text>
      <rect x="354" y="284" width="24" height="12" rx="6" fill="#2d3142" fill-opacity="0.12"/><text x="366" y="292" class="step-number">03</text><text x="386" y="293" class="legend-text">Jev</text>
      <rect x="424" y="284" width="24" height="12" rx="6" fill="#2d3142" fill-opacity="0.12"/><text x="436" y="292" class="step-number">04</text><text x="456" y="293" class="legend-text">Check</text>
      <rect x="494" y="284" width="24" height="12" rx="6" fill="#eb6c36" fill-opacity="0.20"/><text x="506" y="292" class="step-number focal-text">05</text><text x="526" y="293" class="legend-text">Decide</text>
      <text x="164" y="314" class="legend-label">DATA TYPE</text>
      <rect x="180" y="306" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="188" y="312" class="chip-text">DB</text><text x="202" y="314" class="legend-text">fixture / dataset</text>
      <rect x="316" y="306" width="16" height="8" rx="3" fill="#b8915a"/><text x="324" y="312" class="chip-text">TB</text><text x="338" y="314" class="legend-text">metrics</text>
      <text x="420" y="314" class="legend-text">left = input · right = output</text>
      <text x="164" y="336" class="legend-label">FLOW</text>
      <line x1="180" y1="333" x2="204" y2="333" stroke="#4f5d75" marker-end="url(#jevx-eval-muted)"/><text x="212" y="336" class="legend-text">standard</text>
      <line x1="286" y1="333" x2="310" y2="333" stroke="#4f5d75" stroke-dasharray="4,3" marker-end="url(#jevx-eval-muted)"/><text x="318" y="336" class="legend-text">optional</text>
      <line x1="400" y1="333" x2="424" y2="333" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#jevx-eval-accent)"/><text x="432" y="336" class="legend-text">safe metrics to reader</text>
    </svg>
