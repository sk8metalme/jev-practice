<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jevxの全体像</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75;
      --soft: #7a8399; --rule: rgba(45,49,66,0.12); --accent: #eb6c36;
      --link: #2e5aa8; --sans: 'Geist', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      --serif: 'Instrument Serif', serif; --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; margin: 0; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 960px; margin: 0 auto; }
    .eyebrow { margin: 0 0 .5rem; color: var(--muted); font: 500 .66rem var(--mono); letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0 0 .5rem; font: 400 clamp(1.7rem, 2.5vw + .8rem, 2.35rem)/1.1 var(--serif); letter-spacing: -.02em; }
    .dek { max-width: 46rem; margin: 0 0 1.5rem; color: var(--muted); font-size: .95rem; line-height: 1.7; }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">JEVX · OVERVIEW</p>
    <h1>「提案」と「実行」を分けて、安全にSkillを選ぶ</h1>
    <p class="dek">jevxは候補を見つけて判断材料を返します。Skillの実行や会話の書き換えは利用者が決め、Telemetryも本文ではなく集計に必要な情報だけを扱います。</p>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="jevx-overview-title jevx-overview-desc">
      <title id="jevx-overview-title">jevxのSkill選択とデータ境界</title>
      <desc id="jevx-overview-desc">利用者の依頼をローカルでSkill候補へ絞り、必要な場合だけJevへ判定を依頼し、結果と安全なTelemetryを返す流れ。会話全文やTool結果は送信しない。</desc>
      <defs>
        <style>
          .zone-label { fill: #4f5d75; font: 500 8px 'Geist Mono', ui-monospace, monospace; letter-spacing: .16em; }
          .node-title { fill: #2d3142; font: 600 13px 'Geist', 'Hiragino Sans', 'Yu Gothic', sans-serif; text-anchor: middle; }
          .node-sub { fill: #4f5d75; font: 400 9px 'Geist', 'Hiragino Sans', 'Yu Gothic', sans-serif; text-anchor: middle; }
          .node-tech { fill: #7a8399; font: 400 8px 'Geist Mono', ui-monospace, monospace; text-anchor: middle; }
          .tag { fill: #7a8399; font: 500 8px 'Geist Mono', ui-monospace, monospace; letter-spacing: .12em; }
          .legend { fill: #4f5d75; font: 400 10px 'Geist', 'Hiragino Sans', 'Yu Gothic', sans-serif; }
          .legend-key { fill: #4f5d75; font: 500 8px 'Geist Mono', ui-monospace, monospace; letter-spacing: .16em; }
          .arrow-label { fill: #4f5d75; font: 400 8px 'Geist Mono', ui-monospace, monospace; letter-spacing: .05em; text-anchor: middle; }
        </style>
        <marker id="jevx-overview-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#4f5d75"/></marker>
        <marker id="jevx-overview-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#2e5aa8"/></marker>
        <marker id="jevx-overview-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#eb6c36"/></marker>
      </defs>

      <rect width="960" height="600" fill="#f5f5f5"/>

      <!-- Trust zones are drawn before arrows and nodes. -->
      <rect x="40" y="100" width="600" height="340" rx="8" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="672" y="100" width="248" height="200" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.26)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="56" y="104" width="112" height="14" rx="2" fill="#f5f5f5"/>
      <text x="64" y="114" class="zone-label">LOCAL · USER CONTROLLED</text>
      <rect x="688" y="104" width="120" height="14" rx="2" fill="#f5f5f5"/>
      <text x="696" y="114" class="zone-label">OPTIONAL · GATEWAY</text>

      <!-- Connectors are drawn before all node boxes. -->
      <path d="M224 266 H248 Q256 266 256 258 V184 H272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#jevx-overview-arrow)"/>
      <path d="M360 220 V300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#jevx-overview-arrow)"/>
      <path d="M448 336 H464 Q472 336 472 328 V266 H480" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#jevx-overview-accent)"/>
      <path d="M448 336 H640 Q648 336 648 328 V184 H704" fill="none" stroke="#2e5aa8" stroke-width="1.1" stroke-dasharray="5,4" marker-end="url(#jevx-overview-link)"/>
      <path d="M704 184 H664 Q656 184 656 192 V266 H640" fill="none" stroke="#2e5aa8" stroke-width="1.1" marker-end="url(#jevx-overview-link)"/>
      <path d="M560 302 V348" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#jevx-overview-arrow)"/>
      <path d="M224 384 H248" fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4"/>

      <!-- Arrow labels have opaque masks and visible gaps from the strokes. -->
      <rect x="504" y="316" width="122" height="14" rx="2" fill="#f5f5f5"/>
      <text x="565" y="326" class="arrow-label">OPTIONAL JEV CALL</text>
      <circle cx="256" cy="384" r="8" fill="#f5f5f5" stroke="#7a8399" stroke-width="1"/>
      <path d="M252 380 L260 388 M260 380 L252 388" stroke="#7a8399" stroke-width="1.2"/>

      <!-- User input -->
      <rect x="72" y="230" width="152" height="72" rx="6" fill="#f5f5f5" stroke="#7a8399" stroke-width="1"/>
      <rect x="80" y="238" width="30" height="12" rx="2" fill="none" stroke="rgba(122,131,153,0.50)" stroke-width="0.8"/>
      <text x="95" y="247" class="tag">INPUT</text>
      <text x="148" y="270" class="node-title">利用者の依頼</text>
      <text x="148" y="285" class="node-sub">Skillを探したい</text>

      <!-- Local skill catalog -->
      <rect x="272" y="148" width="176" height="72" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="280" y="156" width="42" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
      <text x="301" y="165" class="tag">LOCAL</text>
      <text x="360" y="180" class="node-title">Skillカタログ</text>
      <text x="360" y="195" class="node-sub">project / userを探索</text>

      <!-- Local ranker -->
      <rect x="272" y="300" width="176" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="280" y="308" width="42" height="12" rx="2" fill="rgba(235,108,54,0.14)" stroke="rgba(235,108,54,0.55)" stroke-width="0.8"/>
      <text x="301" y="317" fill="#eb6c36" class="tag">RANK</text>
      <text x="360" y="332" class="node-title">候補を絞る</text>
      <text x="360" y="347" class="node-sub">name / descriptionを採点</text>

      <!-- Decision output -->
      <rect x="480" y="230" width="160" height="72" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="488" y="238" width="46" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
      <text x="511" y="247" class="tag">RESULT</text>
      <text x="560" y="270" class="node-title">提案結果</text>
      <text x="560" y="285" class="node-sub">selected / none</text>

      <!-- Safe telemetry store -->
      <rect x="480" y="348" width="160" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="488" y="356" width="44" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.45)" stroke-width="0.8"/>
      <text x="510" y="365" class="tag">STORE</text>
      <text x="560" y="388" class="node-title">Telemetry</text>
      <text x="560" y="403" class="node-sub">hash / 件数 / 遅延</text>

      <!-- Optional gateway -->
      <rect x="704" y="148" width="152" height="72" rx="6" fill="rgba(46,90,168,0.05)" stroke="#2e5aa8" stroke-width="1"/>
      <rect x="712" y="156" width="36" height="12" rx="2" fill="none" stroke="rgba(46,90,168,0.45)" stroke-width="0.8"/>
      <text x="730" y="165" fill="#2e5aa8" class="tag">JEV</text>
      <text x="780" y="180" class="node-title">外部判定</text>
      <text x="780" y="195" class="node-sub">候補 + noneだけ</text>

      <!-- Explicitly blocked raw content -->
      <rect x="72" y="348" width="152" height="72" rx="6" fill="rgba(45,49,66,0.02)" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="80" y="356" width="36" height="12" rx="2" fill="none" stroke="rgba(122,131,153,0.50)" stroke-width="0.8"/>
      <text x="98" y="365" class="tag">BLOCK</text>
      <text x="148" y="388" class="node-title">会話全文</text>
      <text x="148" y="403" class="node-sub">Tool結果も対象外</text>

      <!-- Bottom legend -->
      <line x1="56" y1="500" x2="904" y2="500" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="56" y="518" class="legend-key">LEGEND</text>
      <rect x="56" y="536" width="14" height="10" rx="2" fill="#ffffff" stroke="rgba(45,49,66,0.30)"/>
      <text x="78" y="545" class="legend">ローカルで確認・判断</text>
      <line x1="256" y1="541" x2="286" y2="541" stroke="#2e5aa8" stroke-width="1.1" stroke-dasharray="5,4" marker-end="url(#jevx-overview-link)"/>
      <text x="296" y="545" class="legend">任意の外部判定</text>
      <line x1="470" y1="541" x2="500" y2="541" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4"/>
      <circle cx="510" cy="541" r="6" fill="#f5f5f5" stroke="#7a8399" stroke-width="1"/>
      <path d="M507 538 L513 544 M513 538 L507 544" stroke="#7a8399" stroke-width="1"/>
      <text x="524" y="545" class="legend">送信しない境界</text>
    </svg>
  </main>
</body>
</html>
