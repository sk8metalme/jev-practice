[package]
name = "jevx"
version = "0.1.0"
edition = "2024"
description = "Jev-powered comfort layer for Codex CLI"
license = "MIT"

[dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3.13"
